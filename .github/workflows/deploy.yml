name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
  DEPLOY_TARGET_DIR: ${{ vars.DEPLOY_TARGET_DIR || '/var/www/hexbit-front' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          required_vars=(
            DEPLOY_HOST
            DEPLOY_PORT
            DEPLOY_TARGET_DIR
            DEPLOY_SSH_USER
            DEPLOY_SSH_PRIVATE_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::Missing required deployment setting: ${var_name}"
              exit 1
            fi
          done

          if [ "${DEPLOY_TARGET_DIR}" = "/" ] || [[ "${DEPLOY_TARGET_DIR}" != /* ]] || [[ "${DEPLOY_TARGET_DIR}" == *".."* ]]; then
            echo "::error::DEPLOY_TARGET_DIR must be a non-root absolute path without '..'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package static-site archive
        id: archive
        run: |
          set -euo pipefail
          ARCHIVE_NAME="hexbit-front-${GITHUB_SHA::12}.tar.gz"
          ARCHIVE_PATH="/tmp/${ARCHIVE_NAME}"
          tar -czf "${ARCHIVE_PATH}" dist
          echo "archive_path=${ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Upload deployment archive
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          scp -i "${HOME}/.ssh/id_ed25519" -P "${DEPLOY_PORT}" \
            "${{ steps.archive.outputs.archive_path }}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_HOST}:/tmp/${{ steps.archive.outputs.archive_name }}"

      - name: Deploy archive to writable target
        env:
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.archive_name }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/id_ed25519" -p "${DEPLOY_PORT}" "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "DEPLOY_TARGET_DIR=$(printf '%q' "${DEPLOY_TARGET_DIR}") ARCHIVE_NAME=$(printf '%q' "${ARCHIVE_NAME}") bash -se" <<'EOF'
          set -euo pipefail
          umask 022

          release_dir="$(mktemp -d "/tmp/.${ARCHIVE_NAME%.tar.gz}.XXXXXX")"
          cleanup() { rm -rf "${release_dir}"; }
          trap cleanup EXIT

          tar -xzf "/tmp/${ARCHIVE_NAME}" -C "${release_dir}" --strip-components=1
          find "${release_dir}" -type d -exec chmod 755 {} +
          find "${release_dir}" -type f -exec chmod 644 {} +

          if [ ! -d "${DEPLOY_TARGET_DIR}" ]; then
            mkdir -p "${DEPLOY_TARGET_DIR}"
          fi
          if [ ! -w "${DEPLOY_TARGET_DIR}" ]; then
            echo "DEPLOY_TARGET_DIR is not writable: ${DEPLOY_TARGET_DIR}" >&2
            echo "Set DEPLOY_TARGET_DIR to a directory owned by the SSH user, or grant write permission to it." >&2
            exit 1
          fi

          find "${DEPLOY_TARGET_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "${release_dir}/." "${DEPLOY_TARGET_DIR}/"
          rm -f "/tmp/${ARCHIVE_NAME}"
          EOF
